[package]
name = "christmas-snow"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A native Christmas snowfall overlay for Hyprland and Wayland"
license = "MIT"

[dependencies]
pollster = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = "0.21.1"
toml = "0.9"
wayland-client = { version = "0.31.15", features = ["system"] }
wgpu = "27.0.1"
bytemuck = { version = "1", features = ["derive"] }
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
toml_edit = "0.25"

[dev-dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
